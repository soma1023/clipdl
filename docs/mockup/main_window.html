<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>clipdl GUI モック</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px; background: #8a8f98; font-family: "Yu Gothic UI", "Segoe UI", sans-serif;
         font-size: 13px; display: flex; gap: 28px; align-items: flex-start; }
  .caption { color: #fff; font-size: 14px; margin: 0 0 8px 2px; }
  .light { --bg:#f3f3f3; --panel:#ffffff; --text:#1b1b1b; --sub:#5f5f5f; --muted:#8a8a8a; --line:#e1e1e1;
           --field:#ffffff; --fieldline:#c9c9c9; --accent:#0067c0; --onaccent:#fff; --track:#e5e5e5;
           --sel:#cfe3f7; --danger-bg:#fde7e9; --danger:#b3261e; --ok:#0f7b0f; --btn:#fbfbfb; --title:#eeeeee; }
  .dark  { --bg:#202020; --panel:#2b2b2b; --text:#f0f0f0; --sub:#b4b4b4; --muted:#8c8c8c; --line:#3a3a3a;
           --field:#1f1f1f; --fieldline:#4a4a4a; --accent:#4cc2ff; --onaccent:#00243a; --track:#3d3d3d;
           --sel:#1c4a66; --danger-bg:#442726; --danger:#ff9a94; --ok:#6ccb5f; --btn:#353535; --title:#1c1c1c; }
  .win { width: 820px; background: var(--bg); color: var(--text); border: 1px solid #00000040;
         border-radius: 8px; overflow: hidden; }
  .title { height: 34px; display: flex; align-items: center; padding: 0 12px; gap: 8px; background: var(--title);
           font-size: 12px; color: var(--sub); }
  .title .ctl { margin-left: auto; display: flex; gap: 22px; letter-spacing: 2px; }
  .body { padding: 14px 16px 0; }
  .sec { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px;
         margin-bottom: 10px; }
  .lab { color: var(--sub); font-size: 12px; margin: 0 0 6px; }
  .step { display: inline-block; min-width: 18px; height: 18px; line-height: 18px; text-align: center;
          border-radius: 9px; background: var(--accent); color: var(--onaccent); font-size: 11px; margin-right: 6px; }
  .row { display: flex; align-items: center; gap: 8px; }
  input[type=text], .field { height: 30px; border: 1px solid var(--fieldline); border-bottom-color: var(--sub);
         border-radius: 4px; background: var(--field); color: var(--text); padding: 0 8px; font: inherit;
         display: flex; align-items: center; }
  .mono { font-family: Consolas, monospace; font-size: 12.5px; }
  .btn { height: 30px; padding: 0 12px; border: 1px solid var(--fieldline); border-radius: 4px;
         background: var(--btn); color: var(--text); display: inline-flex; align-items: center; gap: 6px; }
  .btn.primary { background: var(--accent); color: var(--onaccent); border-color: var(--accent);
                 height: 34px; padding: 0 26px; font-size: 14px; }
  .ib { width: 28px; height: 28px; border: 1px solid var(--fieldline); border-radius: 4px; background: var(--btn);
        display: inline-flex; align-items: center; justify-content: center; color: var(--text); font-size: 12px; }
  .thumb { width: 120px; height: 68px; border-radius: 4px; background: linear-gradient(135deg,#4b6b3a,#203a1a);
           position: relative; flex: none; }
  .thumb span { position: absolute; right: 4px; bottom: 4px; background: #000a; color: #fff; font-size: 10px;
                padding: 0 4px; border-radius: 2px; }
  .bar { position: relative; height: 34px; margin: 4px 6px 8px; }
  .track { position: absolute; left: 0; right: 0; top: 15px; height: 4px; border-radius: 2px; background: var(--track); }
  .seg { position: absolute; top: 13px; height: 8px; border-radius: 2px; background: var(--accent); opacity: .85; }
  .seg.sel { opacity: 1; }
  .knob { position: absolute; top: 9px; width: 12px; height: 16px; margin-left: -6px; border-radius: 3px;
          background: var(--panel); border: 2px solid var(--accent); }
  .tick { position: absolute; top: -2px; font-size: 10.5px; color: var(--muted); }
  .clip { display: grid; grid-template-columns: 26px 92px 14px 92px 60px 1fr 28px; gap: 6px; align-items: center;
          padding: 4px 6px; border-radius: 4px; }
  .clip.sel { background: var(--sel); }
  .n { font-size: 11px; color: var(--sub); text-align: center; border: 1px solid var(--fieldline); border-radius: 4px; }
  .q { display: grid; grid-template-columns: 1fr 150px 64px; gap: 10px; align-items: center; padding: 7px 0;
       border-top: 1px solid var(--line); }
  .q:first-of-type { border-top: none; }
  .pb { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .pb i { display: block; height: 100%; background: var(--accent); }
  .small { font-size: 11px; color: var(--sub); margin: 2px 0 0; }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }
  .adv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; margin-top: 10px; padding-top: 10px;
         border-top: 1px solid var(--line); }
  .adv .field { width: 100%; justify-content: space-between; }
  .chk { display: inline-flex; align-items: center; gap: 5px; }
  .box { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--sub); display: inline-flex;
         align-items: center; justify-content: center; font-size: 10px; }
  .box.on { background: var(--accent); border-color: var(--accent); color: var(--onaccent); }
  .note { font-size: 11.5px; color: var(--sub); }
  .status { display: flex; align-items: center; gap: 8px; padding: 7px 16px; background: var(--danger-bg);
            color: var(--danger); font-size: 12px; margin-top: 4px; }
  .status .btn { height: 24px; color: var(--danger); border-color: var(--danger); background: transparent; }
  .confirm { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 6px 8px; border-radius: 4px;
             background: var(--sel); font-size: 12px; }
</style>
</head>

</html>
